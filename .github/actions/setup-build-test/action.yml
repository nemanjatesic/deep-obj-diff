name: Setup, Build & Test
description: Shared steps for installing, linting, testing, and building the project

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '20'
  registry-url:
    description: npm registry URL (set for publishing)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url || '' }}
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Lint, Build & Test
      run: npx turbo run lint test
      shell: bash
